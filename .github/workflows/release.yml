name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  # Only publish what passed the E2E tests (incl. the install from an archive)
  e2e:
    uses: $/.github/workflows/e2e.yml
    permissions:
      contents: read

  release:
    needs: e2e
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify tag matches plugin version
        run: |
          set -euo pipefail
          version=$(sed -n "s/^  version '\(.*\)'$/\1/p" init.rb)
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::init.rb version '${version}' does not match tag '${GITHUB_REF_NAME}'"
            exit 1
          fi

      # The archives contain the plugin only (see .gitattributes export-ignore)
      # with the directory name Redmine expects.
      - name: Build archives
        run: |
          set -euo pipefail
          name="redmine_pull_requests-${GITHUB_REF_NAME}"
          mkdir dist
          git archive --format=tar.gz --prefix=redmine_pull_requests/ -o "dist/${name}.tar.gz" HEAD
          git archive --format=zip --prefix=redmine_pull_requests/ -o "dist/${name}.zip" HEAD
          (cd dist && sha256sum -- * > "redmine_pull_requests-${GITHUB_REF_NAME}_checksums.txt")

      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # release notes: the CHANGELOG section of this version
          awk -v v="$version" '/^## /{p = ($2 == v)} p' CHANGELOG.md | tail -n +2 > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for ${version}"
            exit 1
          fi
          # v1.2.0-rc.1 and the like are pre-releases and never become "Latest"
          flags=()
          case "$GITHUB_REF_NAME" in
            *-*) flags+=(--prerelease --latest=false) ;;
          esac
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag "${flags[@]}"
