  text_pull_request_github_web_url: "Dla GitHub Enterprise, np. https://github.example.com"
  text_pull_request_github_api_url: "https://api.github.com lub https://github.example.com/api/v3"
  text_pull_request_github_token: "Token typu fine-grained z dostępem do odczytu pull requestów i statusów commitów albo klasyczny token z zakresem repo, który może też odczytywać przebiegi kontroli (check runs) prywatnych repozytoriów. Wymagany dla prywatnych repozytoriów, dla nierozwiązanych wątków recenzji oraz do aktualizowania recenzji i kontroli przez webhooki. Można go też ustawić za pomocą %{env}."
  text_pull_request_github_webhook_url: "Dodaj w repozytorium lub organizacji webhook z typem zawartości application/json. Zdarzenia: Pull requests, Pull request reviews, Pull request review comments, Pull request review threads, Issue comments, Check runs, Check suites i Statuses."
  text_pull_request_gitlab_web_url: "Dla własnej instancji GitLab (self-managed), np. https://gitlab.example.com"
  text_pull_request_gitlab_api_url: "https://gitlab.com/api/v4 lub https://gitlab.example.com/api/v4"
  text_pull_request_gitlab_token: "Token z zakresem read_api. Wymagany dla prywatnych projektów oraz do wczytywania liczby commitów, autorów, recenzji i pipeline'ów przy zdarzeniach webhooka. Można go też ustawić za pomocą %{env}."
  text_pull_request_gitlab_webhook_url: "Dodaj w projekcie (lub w grupie, w GitLab Premium i Ultimate) webhook z wyzwalaczami „Merge request events”, „Comments” i „Pipeline events”, a sekret webhooka podaj jako „Secret token”."
  text_pull_request_webhook_secret: "Wymagany dla webhooka. Można go też ustawić za pomocą %{env}."
  text_pull_request_link_bare_refs: "W przeciwnym razie powiązywane są tylko odwołania poprzedzone słowem kluczowym (%{keywords})."
  text_pull_request_link_branch_refs: "np. 123-strona-logowania, feature/123-strona-logowania lub issue-123"
  text_pull_request_apply_fix_keywords: "Gdy zostanie scalony pull request z odwołaniem „fixes #123”, zagadnienie zostanie zaktualizowane tak jak w przypadku commita. Zobacz opcję „%{link}” w ustawieniach (zakładka Repozytoria)."

  # Repository allow-list, limits and stored secrets
  permission_manage_pull_request_settings: Zarządzanie ustawieniami pull requestów
  label_pull_request_allowed_repositories: Dozwolone repozytoria
  label_pull_request_configure_repositories: Konfiguruj repozytoria
  label_pull_request_remove_secret: Usuń
  text_pull_request_allowed_repositories: "Pull requesty z tych repozytoriów mogą być powiązywane z zagadnieniami tego projektu przez webhook lub ręcznie. Webhooki z innych repozytoriów są w tym projekcie ignorowane."
  text_pull_request_allowed_repositories_syntax: "Jeden wzorzec w wierszu: owner/repo, owner/* (wszystkie repozytoria właściciela owner), group/** (łącznie z podgrupami). Dodaj prefiks github: lub gitlab:, aby zezwolić tylko na jeden z tych serwisów. Wiersze zaczynające się od # są ignorowane."
  text_pull_request_no_repositories_allowed: W tym projekcie nie ma jeszcze dozwolonych repozytoriów, więc nie można powiązywać pull requestów.
  text_pull_request_no_repositories_allowed_ask: W tym projekcie nie ma jeszcze dozwolonych repozytoriów, więc nie można powiązywać pull requestów. Kierownik projektu może je dodać w ustawieniach projektu (Ustawienia › Pull requesty).
  text_pull_request_secret_stored: Wartość jest zapisana. Pozostaw puste, aby ją zachować.
  error_pull_request_repository_not_allowed: "Repozytorium %{repository} nie jest dozwolone w tym projekcie (Ustawienia › Pull requesty)."
  error_pull_request_no_repositories_allowed: "W tym projekcie nie ma jeszcze dozwolonych repozytoriów (Ustawienia › Pull requesty)."
  error_pull_request_too_many_urls: "Maksymalna liczba pull requestów, które można powiązać naraz: %{count}."
  error_pull_request_invalid_repository_pattern: "Wiersz %{line}: „%{pattern}” nie jest prawidłowym wzorcem repozytorium."
