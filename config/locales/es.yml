  text_pull_request_github_web_url: "Para GitHub Enterprise, p. ej. https://github.example.com"
  text_pull_request_github_api_url: "https://api.github.com o https://github.example.com/api/v3"
  text_pull_request_github_token: "Token fine-grained con acceso de lectura a pull requests y estados de commit, o un token clásico con el ámbito repo, que además puede leer las ejecuciones de comprobaciones (check runs) de repositorios privados. Necesario para repositorios privados, para los hilos de revisión sin resolver y para actualizar revisiones y comprobaciones desde webhooks. También se puede definir con %{env}."
  text_pull_request_github_webhook_url: "Añada a su repositorio u organización un webhook con el tipo de contenido application/json. Eventos: Pull requests, Pull request reviews, Pull request review comments, Pull request review threads, Issue comments, Check runs, Check suites y Statuses."
  text_pull_request_gitlab_web_url: "Para GitLab autogestionado, p. ej. https://gitlab.example.com"
  text_pull_request_gitlab_api_url: "https://gitlab.com/api/v4 o https://gitlab.example.com/api/v4"
  text_pull_request_gitlab_token: "Token con el ámbito read_api. Necesario para proyectos privados y para cargar el número de commits, los autores, las revisiones y los pipelines en los eventos de webhook. También se puede definir con %{env}."
  text_pull_request_gitlab_webhook_url: "Añada a su proyecto (o grupo, en GitLab Premium y Ultimate) un webhook con los disparadores «Merge request events», «Comments» y «Pipeline events», y use el secreto del webhook como «Secret token»."
  text_pull_request_webhook_secret: "Necesario para el webhook. También se puede definir con %{env}."
  text_pull_request_link_bare_refs: "En caso contrario, solo se vinculan las referencias con una palabra clave (%{keywords})."
  text_pull_request_link_branch_refs: "p. ej. 123-pagina-login, feature/123-pagina-login o issue-123"
  text_pull_request_apply_fix_keywords: "Al fusionar un pull request que contiene «fixes #123», la petición se actualiza igual que con un commit. Consulte %{link} en la configuración de repositorios."

  # Repository allow-list, limits and stored secrets
