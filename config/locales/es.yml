  text_pull_request_allowed_repositories: "Los pull requests de estos repositorios se pueden vincular a peticiones de este proyecto, mediante webhook o manualmente. Los webhooks de otros repositorios se ignoran en este proyecto."
  text_pull_request_allowed_repositories_syntax: "Uno por línea: owner/repo, owner/* (todos los repositorios de owner), group/** (incluidos los subgrupos). Anteponga github: o gitlab: para permitir solo uno de los dos. Las líneas que empiezan por # se ignoran."
  text_pull_request_no_repositories_allowed: Todavía no hay repositorios permitidos en este proyecto, por lo que no se pueden vincular pull requests.
  text_pull_request_no_repositories_allowed_ask: Todavía no hay repositorios permitidos en este proyecto, por lo que no se pueden vincular pull requests. Un jefe de proyecto puede permitirlos en Configuración › Pull requests.
