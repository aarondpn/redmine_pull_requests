  error_pull_request_repository_not_allowed: "%{repository} no está permitido en este proyecto (Configuración › Pull requests)."
  error_pull_request_no_repositories_allowed: "Todavía no hay repositorios permitidos en este proyecto (Configuración › Pull requests)."
