  text_pull_request_github_token: "プルリクエストとコミットステータスの読み取り権限を持つFine-grainedトークン、またはrepoスコープを持つクラシックトークン(プライベートリポジトリのチェック実行も読み取れます)。プライベートリポジトリ、未解決のレビュースレッド、Webhookによるレビューとチェックの更新に必要です。%{env} でも設定できます。"
  text_pull_request_github_webhook_url: "リポジトリまたはOrganizationに、Content typeがapplication/jsonのWebhookを追加してください。イベント: Pull requests、Pull request reviews、Pull request review comments、Pull request review threads、Issue comments、Check runs、Check suites、Statuses。"
  text_pull_request_gitlab_web_url: "セルフマネージドのGitLabの場合。例: https://gitlab.example.com"
  text_pull_request_gitlab_api_url: "https://gitlab.com/api/v4 または https://gitlab.example.com/api/v4"
  text_pull_request_gitlab_token: "read_apiスコープを持つトークン。プライベートプロジェクトと、Webhookイベントでコミット数・作成者・レビュー・パイプラインを読み込むために必要です。%{env} でも設定できます。"
  text_pull_request_gitlab_webhook_url: "プロジェクト(GitLab PremiumおよびUltimateではグループも可)にWebhookを追加し、トリガーに「マージリクエストイベント」「コメント」「パイプラインイベント」を選択して、Webhookシークレットをシークレットトークンに設定してください。"
  text_pull_request_webhook_secret: "Webhookに必要です。%{env} でも設定できます。"
  text_pull_request_link_bare_refs: "無効の場合、キーワード付きの参照(%{keywords})のみが関連付けられます。"
  text_pull_request_link_branch_refs: "例: 123-login-page、feature/123-login-page、issue-123"
  text_pull_request_apply_fix_keywords: "「fixes #123」のように参照しているプルリクエストがマージされると、コミットと同様にチケットが更新されます。「管理 » 設定 » リポジトリ」の「%{link}」を参照してください。"

