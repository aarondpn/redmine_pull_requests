  text_pull_request_github_web_url: "Для GitHub Enterprise, например https://github.example.com"
  text_pull_request_github_api_url: "https://api.github.com или https://github.example.com/api/v3"
  text_pull_request_github_token: "Детализированный токен (fine-grained) с правом чтения запросов на слияние и статусов коммитов или классический токен с областью repo, который также может читать запуски проверок (check runs) приватных репозиториев. Необходим для приватных репозиториев, для нерешённых обсуждений и для обновления рецензий и проверок по вебхукам. Также можно задать через %{env}."
  text_pull_request_github_webhook_url: "Добавьте в репозиторий или организацию вебхук с типом содержимого application/json. События: Pull requests, Pull request reviews, Pull request review comments, Pull request review threads, Issue comments, Check runs, Check suites и Statuses."
  text_pull_request_gitlab_web_url: "Для собственного экземпляра GitLab (self-managed), например https://gitlab.example.com"
  text_pull_request_gitlab_api_url: "https://gitlab.com/api/v4 или https://gitlab.example.com/api/v4"
  text_pull_request_gitlab_token: "Токен с областью read_api. Необходим для приватных проектов и для загрузки числа коммитов, авторов, рецензий и конвейеров при событиях вебхука. Также можно задать через %{env}."
  text_pull_request_gitlab_webhook_url: "Добавьте в проект (или в группу — в GitLab Premium и Ultimate) вебхук с триггерами «Merge request events», «Comments» и «Pipeline events» и укажите секрет вебхука в поле «Secret token»."
  text_pull_request_webhook_secret: "Необходим для вебхука. Также можно задать через %{env}."
  text_pull_request_link_bare_refs: "Иначе связываются только ссылки с ключевым словом (%{keywords})."
  text_pull_request_link_branch_refs: "Например: 123-login-page, feature/123-login-page или issue-123"
  text_pull_request_apply_fix_keywords: "Когда запрос на слияние со ссылкой «fixes #123» сливается, задача обновляется так же, как при коммите. См. «%{link}» на вкладке «Хранилища» в настройках."

  # Repository allow-list, limits and stored secrets
  permission_manage_pull_request_settings: Управление настройками запросов на слияние
  label_pull_request_allowed_repositories: Разрешённые репозитории
  label_pull_request_configure_repositories: Настроить репозитории
  label_pull_request_remove_secret: Удалить
  text_pull_request_allowed_repositories: "Запросы на слияние из этих репозиториев можно связывать с задачами этого проекта — через вебхук или вручную. Вебхуки из других репозиториев для этого проекта игнорируются."
  text_pull_request_allowed_repositories_syntax: "По одному шаблону в строке: owner/repo, owner/* (все репозитории owner), group/** (включая подгруппы). С префиксом github: или gitlab: шаблон действует только для этого сервиса. Строки, начинающиеся с #, игнорируются."
  text_pull_request_no_repositories_allowed: В этом проекте пока нет разрешённых репозиториев, поэтому связывать запросы на слияние нельзя.
  text_pull_request_no_repositories_allowed_ask: В этом проекте пока нет разрешённых репозиториев, поэтому связывать запросы на слияние нельзя. Менеджер проекта может разрешить их в настройках проекта.
  text_pull_request_secret_stored: Значение сохранено. Оставьте поле пустым, чтобы не изменять его.
  error_pull_request_repository_not_allowed: "Репозиторий %{repository} не разрешён в этом проекте (Настройки › Запросы на слияние)."
  error_pull_request_no_repositories_allowed: "В этом проекте пока нет разрешённых репозиториев (Настройки › Запросы на слияние)."
  error_pull_request_too_many_urls: "Максимальное количество запросов на слияние, связываемых за один раз: %{count}."
  error_pull_request_invalid_repository_pattern: "Строка %{line}: «%{pattern}» не является допустимым шаблоном репозитория."
