  text_pull_request_github_web_url: "适用于 GitHub Enterprise，例如 https://github.example.com"
  text_pull_request_github_api_url: "https://api.github.com 或 https://github.example.com/api/v3"
  text_pull_request_github_token: "具有拉取请求和提交状态读取权限的细粒度令牌，或具有 repo 范围的经典令牌（后者还能读取私有仓库的检查运行）。私有仓库、未解决的审查讨论以及通过 Webhook 更新审查和检查时必须配置。也可以通过 %{env} 设置。"
  text_pull_request_github_webhook_url: "在仓库或组织中添加一个内容类型为 application/json 的 Webhook。事件：Pull requests、Pull request reviews、Pull request review comments、Pull request review threads、Issue comments、Check runs、Check suites 和 Statuses。"
  text_pull_request_gitlab_web_url: "适用于自托管 GitLab，例如 https://gitlab.example.com"
  text_pull_request_gitlab_api_url: "https://gitlab.com/api/v4 或 https://gitlab.example.com/api/v4"
  text_pull_request_gitlab_token: "具有 read_api 范围的令牌。私有项目以及在 Webhook 事件中加载提交数、作者、审查和流水线时必须配置。也可以通过 %{env} 设置。"
  text_pull_request_gitlab_webhook_url: "在项目（在 GitLab Premium 和 Ultimate 中也可以是群组）中添加 Webhook，触发器选择合并请求事件、评论和流水线事件，并将 Webhook 密钥填写为 Secret 令牌。"
  text_pull_request_webhook_secret: "Webhook 必须配置此项。也可以通过 %{env} 设置。"
  text_pull_request_link_bare_refs: "否则只关联带有关键字的引用（%{keywords}）。"
  text_pull_request_link_branch_refs: "例如 123-login-page、feature/123-login-page 或 issue-123"
  text_pull_request_apply_fix_keywords: "包含“fixes #123”这类引用的拉取请求被合并时，问题会像提交一样被更新。参见“管理 » 配置 » 版本库”中的“%{link}”。"

