  text_pull_request_github_web_url: "Für GitHub Enterprise, z. B. https://github.example.com"
  text_pull_request_github_api_url: "https://api.github.com oder https://github.example.com/api/v3"
  text_pull_request_github_token: "Fine-grained Token mit Lesezugriff auf Pull Requests und Commit-Status, oder ein klassisches Token mit dem Scope repo, das auch die Check-Runs privater Repositories lesen kann. Erforderlich für private Repositories, offene Review-Threads und um Reviews und Checks per Webhook zu aktualisieren. Alternativ über %{env}."
  text_pull_request_github_webhook_url: "Im Repository oder der Organisation einen Webhook mit Content-Type application/json anlegen. Events: Pull requests, Pull request reviews, Pull request review comments, Pull request review threads, Issue comments, Check runs, Check suites und Statuses."
  text_pull_request_gitlab_web_url: "Für selbst gehostetes GitLab, z. B. https://gitlab.example.com"
  text_pull_request_gitlab_api_url: "https://gitlab.com/api/v4 oder https://gitlab.example.com/api/v4"
  text_pull_request_gitlab_token: "Token mit dem Scope read_api. Erforderlich für private Projekte und um Commit-Anzahl, Autor, Reviews und Pipelines bei Webhook-Events zu laden. Alternativ über %{env}."
  text_pull_request_gitlab_webhook_url: "Im Projekt (oder in der Gruppe, ab GitLab Premium) einen Webhook mit den Triggern „Merge request events“, „Comments“ und „Pipeline events“ anlegen und das Webhook-Secret als Secret Token eintragen."
  text_pull_request_webhook_secret: "Für den Webhook erforderlich. Alternativ über %{env}."
  text_pull_request_link_bare_refs: "Sonst werden nur Referenzen mit Schlüsselwort verknüpft (%{keywords})."
  text_pull_request_link_branch_refs: "z. B. 123-login-seite, feature/123-login-seite oder issue-123"
  text_pull_request_apply_fix_keywords: "Wird ein Pull Request mit „fixes #123“ gemergt, wird das Ticket wie bei einem Commit aktualisiert. Siehe %{link} in den Repository-Einstellungen."

  # Repository allow-list, limits and stored secrets
  permission_manage_pull_request_settings: Pull-Request-Einstellungen verwalten
  label_pull_request_allowed_repositories: Erlaubte Repositories
  label_pull_request_configure_repositories: Repositories einrichten
  label_pull_request_remove_secret: Entfernen
  text_pull_request_allowed_repositories: "Pull Requests aus diesen Repositories können mit Tickets dieses Projekts verknüpft werden, per Webhook oder von Hand. Webhooks anderer Repositories werden für dieses Projekt ignoriert."
  text_pull_request_allowed_repositories_syntax: "Ein Muster pro Zeile: owner/repo, owner/* (alle Repositories von owner), group/** (inklusive Untergruppen). Mit vorangestelltem github: oder gitlab: gilt der Eintrag nur dort. Zeilen, die mit # beginnen, werden ignoriert."
  text_pull_request_no_repositories_allowed: In diesem Projekt sind noch keine Repositories erlaubt, deshalb können keine Pull Requests verknüpft werden.
  text_pull_request_no_repositories_allowed_ask: In diesem Projekt sind noch keine Repositories erlaubt, deshalb können keine Pull Requests verknüpft werden. Projektverantwortliche können sie unter Konfiguration › Pull Requests erlauben.
  text_pull_request_secret_stored: Ein Wert ist gespeichert. Leer lassen, um ihn zu behalten.
  error_pull_request_repository_not_allowed: "%{repository} ist in diesem Projekt nicht erlaubt (Konfiguration › Pull Requests)."
  error_pull_request_no_repositories_allowed: "In diesem Projekt sind noch keine Repositories erlaubt (Konfiguration › Pull Requests)."
