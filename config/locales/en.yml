  text_pull_request_github_web_url: "For GitHub Enterprise, e.g. https://github.example.com"
  text_pull_request_github_api_url: "https://api.github.com or https://github.example.com/api/v3"
  text_pull_request_github_token: "Fine-grained token with read access to pull requests and commit statuses, or a classic token with the repo scope, which can also read check runs of private repositories. Required for private repositories, for unresolved review threads and to update reviews and checks from webhooks. Can also be set with %{env}."
  text_pull_request_github_webhook_url: "Add a webhook with content type application/json to your repository or organization. Events: pull requests, pull request reviews, pull request review comments, pull request review threads, issue comments, check runs, check suites and statuses."
  text_pull_request_gitlab_web_url: "For self-managed GitLab, e.g. https://gitlab.example.com"
  text_pull_request_gitlab_api_url: "https://gitlab.com/api/v4 or https://gitlab.example.com/api/v4"
  text_pull_request_gitlab_token: "Token with the read_api scope. Required for private projects and to load commit counts, authors, reviews and pipelines for webhook events. Can also be set with %{env}."
  text_pull_request_gitlab_webhook_url: "Add a webhook to your project (or group, on GitLab Premium and Ultimate) with the triggers merge request events, comments and pipeline events, and use the webhook secret as secret token."
  text_pull_request_webhook_secret: "Required for the webhook. Can also be set with %{env}."
  text_pull_request_link_bare_refs: "Otherwise only references with a keyword are linked (%{keywords})."
  text_pull_request_link_branch_refs: "e.g. 123-login-page, feature/123-login-page or issue-123"
  text_pull_request_apply_fix_keywords: "When a pull request referencing \"fixes #123\" is merged, the issue is updated like by a commit. See %{link} in the repository settings."

