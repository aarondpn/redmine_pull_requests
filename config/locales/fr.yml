  text_pull_request_github_web_url: "Pour GitHub Enterprise, par exemple https://github.example.com"
  text_pull_request_github_api_url: "https://api.github.com ou https://github.example.com/api/v3"
  text_pull_request_github_token: "Jeton à granularité fine (fine-grained) avec accès en lecture aux pull requests et aux statuts de commit, ou jeton classique avec la portée repo, qui peut aussi lire les exécutions de vérification (check runs) des dépôts privés. Requis pour les dépôts privés, pour les discussions de revue non résolues et pour mettre à jour les revues et les vérifications via les webhooks. Peut aussi être défini avec %{env}."
  text_pull_request_github_webhook_url: "Ajoutez un webhook avec le type de contenu application/json à votre dépôt ou à votre organisation. Événements : Pull requests, Pull request reviews, Pull request review comments, Pull request review threads, Issue comments, Check runs, Check suites et Statuses."
  text_pull_request_gitlab_web_url: "Pour une instance GitLab autogérée, par exemple https://gitlab.example.com"
  text_pull_request_gitlab_api_url: "https://gitlab.com/api/v4 ou https://gitlab.example.com/api/v4"
  text_pull_request_gitlab_token: "Jeton avec la portée read_api. Requis pour les projets privés et pour charger le nombre de commits, les auteurs, les revues et les pipelines lors des événements de webhook. Peut aussi être défini avec %{env}."
  text_pull_request_gitlab_webhook_url: "Ajoutez un webhook à votre projet (ou à votre groupe, avec GitLab Premium et Ultimate) avec les déclencheurs « Merge request events », « Comments » et « Pipeline events », et utilisez le secret du webhook comme « Secret token »."
  text_pull_request_webhook_secret: "Requis pour le webhook. Peut aussi être défini avec %{env}."
  text_pull_request_link_bare_refs: "Sinon, seules les références précédées d'un mot-clé sont liées (%{keywords})."
  text_pull_request_link_branch_refs: "par exemple 123-page-connexion, feature/123-page-connexion ou issue-123"
  text_pull_request_apply_fix_keywords: "Lorsqu'une pull request mentionnant « fixes #123 » est fusionnée, la demande est mise à jour comme par un commit. Voir %{link} dans Administration › Configuration › Dépôts."

  # Repository allow-list, limits and stored secrets
  permission_manage_pull_request_settings: Gérer la configuration des pull requests
  label_pull_request_allowed_repositories: Dépôts autorisés
  label_pull_request_configure_repositories: Configurer les dépôts
  label_pull_request_remove_secret: Supprimer
  text_pull_request_allowed_repositories: "Les pull requests de ces dépôts peuvent être liées aux demandes de ce projet, par webhook ou manuellement. Les webhooks provenant d'autres dépôts sont ignorés pour ce projet."
  text_pull_request_allowed_repositories_syntax: "Un par ligne : owner/repo, owner/* (tous les dépôts de owner), group/** (sous-groupes compris). Préfixez par github: ou gitlab: pour n'autoriser que l'un des deux. Les lignes commençant par # sont ignorées."
  text_pull_request_no_repositories_allowed: Aucun dépôt n'est encore autorisé dans ce projet, les pull requests ne peuvent donc pas être liées.
  text_pull_request_no_repositories_allowed_ask: Aucun dépôt n'est encore autorisé dans ce projet, les pull requests ne peuvent donc pas être liées. Un responsable du projet peut les autoriser dans Configuration › Pull requests.
  text_pull_request_secret_stored: Une valeur est enregistrée. Laissez vide pour la conserver.
  error_pull_request_repository_not_allowed: "%{repository} n'est pas autorisé dans ce projet (Configuration › Pull requests)."
  error_pull_request_no_repositories_allowed: "Aucun dépôt n'est encore autorisé dans ce projet (Configuration › Pull requests)."
  error_pull_request_too_many_urls: "Veuillez lier au maximum %{count} pull requests à la fois."
  error_pull_request_invalid_repository_pattern: "Ligne %{line} : « %{pattern} » n'est pas un motif de dépôt valide."
